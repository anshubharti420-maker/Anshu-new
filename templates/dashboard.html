<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshu Live Stock Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wider text-emerald-400">ANSHU SCREENER</h1>
            </div>
            
            <button onclick="refreshData()" id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg flex items-center space-x-2 transition-all shadow-md active:scale-95">
                <i class="fa-solid fa-rotate animate-duration-500" id="refreshIcon"></i>
                <span class="text-sm">Refresh Data</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center shadow">
                <p class="text-xs text-slate-400 font-medium uppercase">Accuracy</p>
                <p class="text-2xl font-black text-emerald-400 mt-1" id="accuracyBox">75%</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center shadow">
                <p class="text-xs text-slate-400 font-medium uppercase">Total Hits</p>
                <p class="text-2xl font-black text-blue-400 mt-1" id="hitsBox">3</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center shadow">
                <p class="text-xs text-slate-400 font-medium uppercase">Total Signals</p>
                <p class="text-2xl font-black text-purple-400 mt-1" id="totalBox">4</p>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
            <div class="px-4 py-3 bg-slate-750 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-slate-300 flex items-center space-x-2">
                    <i class="fa-solid fa-bolt text-amber-400"></i>
                    <span>Live Trading Signals</span>
                </h3>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase font-semibold border-b border-slate-700">
                            <th class="p-4">Symbol</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Price</th>
                            <th class="p-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="signalsTableBody" class="divide-y divide-slate-700/50 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');
            
            // Spinning Animation Chalu karein
            icon.classList.add('fa-spin');
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/refresh');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const tbody = document.getElementById('signalsTableBody');
                    tbody.innerHTML = '';
                    
                    let total = result.signals.length;
                    let hits = 0;
                    
                    result.signals.forEach(stock => {
                        if(stock.hit === true) hits++;
                        
                        let badgeColor = stock.hit === true ? 'bg-emerald-500/10 text-emerald-400' : (stock.hit === false ? 'bg-rose-500/10 text-rose-400' : 'bg-slate-500/10 text-slate-400');
                        let badgeText = stock.hit === true ? 'HIT ✅' : (stock.hit === false ? 'MISS ❌' : 'PENDING ⏳');
                        let typeColor = stock.signal_type === 'BTST' ? 'text-cyan-400' : 'text-amber-400';

                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-750/40 transition-colors">
                                <td class="p-4 font-bold text-slate-200 tracking-wide">${stock.symbol}</td>
                                <td class="p-4"><span class="text-xs font-bold ${typeColor}">${stock.signal_type}</span></td>
                                <td class="p-4 font-mono text-slate-300">₹${stock.price_at_signal}</td>
                                <td class="p-4 text-center"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">${badgeText}</span></td>
                            </tr>
                        `;
                    });

                    // Stats Refresh Karein Live
                    document.getElementById('totalBox').innerText = total;
                    document.getElementById('hitsBox').innerText = hits;
                    document.getElementById('accuracyBox').innerText = total > 0 ? (Math.round((hits / total) * 100)) + '%' : '0%';
                }
            } catch (error) {
                console.error("Error refreshing dashboard data:", error);
            } finally {
                // Animation Stop karein
                setTimeout(() => {
                    icon.classList.remove('fa-spin');
                    btn.disabled = false;
                }, 600);
            }
        }

        // Page load hote hi automatic data khich le
        window.onload = refreshData;
    </script>
</body>
</html>
