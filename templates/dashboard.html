<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshu Screener - Premium Trading Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-12">

    <header class="bg-[#111827]/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <div>
                    <h1 class="text-lg font-black tracking-wider bg-gradient-to-r from-amber-400 to-emerald-400 bg-clip-text text-transparent">ANSHU SCREENER</h1>
                    <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Pine Script Institutional Logic</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <span id="timerBadge" class="text-[11px] font-bold px-3 py-1.5 rounded-xl bg-slate-900 text-cyan-400 border border-slate-800 tracking-wider">
                    <i class="fa-solid fa-clock mr-1"></i> Sync: 60s
                </span>
                <a href="/login-upstox" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center space-x-1.5 transition-all shadow-lg active:scale-95">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Upstox Live</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

        <div class="space-y-4">
            <div class="bg-[#1e1b12] border border-amber-500/20 px-4 py-3 rounded-xl flex justify-between items-center">
                <div class="flex items-center space-x-2 text-amber-400 font-extrabold tracking-wide text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles animate-pulse"></i>
                    <span>⚡ BTST CANDIDATES</span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">Buy Today - Sell Tomorrow</span>
                </div>
                <span class="text-xs text-slate-400 font-semibold" id="btstCount">0 Stocks</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="btstContainer">
                </div>
        </div>


        <div class="space-y-4">
            <div class="bg-[#111c2e] border border-blue-500/20 px-4 py-3 rounded-xl flex justify-between items-center">
                <div class="flex items-center space-x-2 text-blue-400 font-extrabold tracking-wide text-sm">
                    <i class="fa-solid fa-chart-bar"></i>
                    <span>🔷 INTRADAY TOP 10</span>
                    <span class="text-xs bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20">High Momentum Vol Spike</span>
                </div>
                <span class="text-xs text-slate-400 font-semibold" id="intradayCount">0 Stocks</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="intradayContainer">
                </div>
        </div>

    </main>

    <script>
        let countdownTime = 60;
        const timerBadge = document.getElementById('timerBadge');

        async function refreshDashboard() {
            try {
                const response = await fetch('/api/refresh');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const btstContainer = document.getElementById('btstContainer');
                    const intradayContainer = document.getElementById('intradayContainer');
                    
                    btstContainer.innerHTML = '';
                    intradayContainer.innerHTML = '';
                    
                    let btstCount = 0;
                    let intradayCount = 0;
                    
                    result.signals.forEach(stock => {
                        let isBuy = stock.direction.toUpperCase() === 'BUY' || stock.direction.toUpperCase() === 'UP';
                        let typeColor = isBuy ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20';
                        let typeText = isBuy ? 'Buy' : 'Sell';
                        
                        let target1 = parseFloat(stock.target1 || (stock.price_at_signal * 1.01)).toFixed(2);
                        let sl = parseFloat(stock.stop_loss || (stock.price_at_signal * 0.995)).toFixed(2);
                        let ltp = parseFloat(stock.ltp || stock.price_at_signal).toFixed(2);
                        let entry = parseFloat(stock.price_at_signal).toFixed(2);
                        
                        // Premium Premium Content Box Builder matching screenshots
                        let cardHTML = `
                            <div class="bg-[#111827] rounded-xl p-4 border border-slate-800 shadow-lg hover:border-slate-700 transition-all flex flex-col justify-between space-y-3">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class="text-base font-black text-white tracking-wide">${stock.symbol}</span>
                                        <span class="text-[10px] ml-1.5 font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 uppercase border border-slate-700">${stock.strategy || 'Volume Spike'}</span>
                                    </div>
                                    <span class="text-xs font-black px-2 py-0.5 rounded-md ${typeColor}">${typeText} ₹${entry}</span>
                                </div>
                                
                                <div class="grid grid-cols-3 gap-2 text-center py-2 bg-slate-900/40 rounded-lg border border-slate-800/60">
                                    <div>
                                        <div class="text-[10px] text-slate-500 font-bold uppercase">LTP</div>
                                        <div class="text-sm font-black text-cyan-400">₹${ltp}</div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-slate-500 font-bold uppercase">Target 1</div>
                                        <div class="text-sm font-black text-emerald-400">₹${target1}</div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-slate-500 font-bold uppercase">Stop Loss</div>
                                        <div class="text-sm font-black text-rose-400">₹${sl}</div>
                                    </div>
                                </div>
                                
                                <div class="flex justify-between items-center text-[10px] text-slate-500 font-semibold pt-1">
                                    <span>Timeframe: ${stock.timeframe || '15 Min'}</span>
                                    <span class="text-slate-400">Score: <strong class="text-amber-400 font-extrabold">95/100</strong></span>
                                </div>
                            </div>
                        `;
                        
                        if (stock.signal_type.toUpperCase() === 'BTST') {
                            btstContainer.innerHTML += cardHTML;
                            btstCount++;
                        } else {
                            intradayContainer.innerHTML += cardHTML;
                            intradayCount++;
                        }
                    });
                    
                    document.getElementById('btstCount').innerText = `${btstCount} Stocks`;
                    document.getElementById('intradayCount').innerText = `${intradayCount} Stocks`;
                }
            } catch (error) {
                console.error("Error updates dynamic components:", error);
            } finally {
                countdownTime = 60;
            }
        }

        setInterval(() => {
            countdownTime--;
            timerBadge.innerHTML = `<i class="fa-solid fa-stopwatch mr-1"></i> Sync: ${countdownTime}s`;
            if (countdownTime <= 0) {
                refreshDashboard();
            }
        }, 1000);

        window.onload = refreshDashboard;
    </script>
</body>
</html>
