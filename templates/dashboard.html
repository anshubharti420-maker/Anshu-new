<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshu Full Institutional Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070f; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

    <header class="bg-[#0b0e17]/90 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 lg:px-6 h-20 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-bolt text-slate-900 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-emerald-400 via-cyan-400 to-amber-400 bg-clip-text text-transparent">ANSHU SCREENER ENGINE</h1>
                    <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase mt-0.5">Monorepo Production Hub v5.0</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div id="liveClock" class="hidden md:flex text-[11px] font-bold px-3 py-2 bg-slate-900/60 text-slate-400 rounded-xl border border-slate-800/60 tracking-wider">
                    <i class="fa-regular fa-clock text-emerald-400 mr-2 self-center"></i> <span id="clockData">SYNCING</span>
                </div>
                <div id="timerBadge" class="text-[11px] font-bold px-3 py-2 bg-slate-900 text-cyan-400 border border-slate-800 rounded-xl tracking-wider">
                    Sync: 60s
                </div>
                <a href="/login-upstox" class="bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-900/20 transition-all flex items-center space-x-2 active:scale-95">
                    <i class="fa-solid fa-key text-[11px]"></i>
                    <span>Connect Upstox</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 lg:px-6 py-8 space-y-10">

        <div class="space-y-4">
            <div class="flex justify-between items-center border-l-4 border-amber-500 pl-3">
                <div>
                    <h2 class="text-base font-extrabold tracking-wide text-amber-400 uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>⚡ BTST CANDIDATES</span>
                    </h2>
                    <p class="text-xs text-slate-500">High delivery accumulations & overnight structural trades</p>
                </div>
                <span class="text-xs font-bold px-3 py-1 bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20" id="btstCount">0 Stocks</span>
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-5" id="btstContainer"></div>
        </div>

        <div class="space-y-4">
            <div class="flex justify-between items-center border-l-4 border-cyan-500 pl-3">
                <div>
                    <h2 class="text-base font-extrabold tracking-wide text-cyan-400 uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>🔷 INTRADAY TOP 10</span>
                    </h2>
                    <p class="text-xs text-slate-500">Live option chain PCR trackers & moving averages convergence spikes</p>
                </div>
                <span class="text-xs font-bold px-3 py-1 bg-cyan-500/10 text-cyan-400 rounded-full border border-cyan-500/20" id="intradayCount">0 Stocks</span>
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-5" id="intradayContainer"></div>
        </div>

    </main>

    <script>
        let countdownTime = 60;
        const timerBadge = document.getElementById('timerBadge');

        function parseBadge(status) {
            if (status === 'BULLISH') return 'bg-emerald-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20';
            if (status === 'BEARISH') return 'bg-rose-600 text-white font-black';
            return 'bg-slate-800 text-slate-400 font-bold';
        }

        async function updateDashboardData() {
            try {
                const res = await fetch('/api/refresh');
                const data = await res.json();
                
                if (data.status === 'success') {
                    const btstContainer = document.getElementById('btstContainer');
                    const intradayContainer = document.getElementById('intradayContainer');
                    
                    btstContainer.innerHTML = '';
                    intradayContainer.innerHTML = '';
                    
                    let btst = 0, intraday = 0;
                    
                    data.signals.forEach(stock => {
                        let isUp = stock.direction.toUpperCase() === 'UP' || stock.direction.toUpperCase() === 'BUY';
                        let trendColor = isUp ? 'text-emerald-400 border-emerald-500/20 bg-emerald-500/5' : 'text-rose-400 border-rose-500/20 bg-rose-500/5';
                        
                        let cardHTML = `
                            <div class="bg-[#0b0d16] border border-slate-900 hover:border-slate-800 transition-all rounded-2xl p-5 shadow-2xl flex flex-col justify-between space-y-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <div class="flex items-center space-x-2.5">
                                            <span class="text-lg font-black text-white tracking-wide">${stock.symbol}</span>
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 text-slate-400 uppercase border border-slate-800">${stock.strategy}</span>
                                        </div>
                                        <div class="flex items-center space-x-3 mt-1.5 text-[11px] text-slate-400 font-semibold">
                                            <span>Delivery: <strong class="text-slate-200">${stock.delivery_pct}%</strong></span>
                                            <span class="text-slate-600">•</span>
                                            <span>OI PCR: <strong class="text-slate-200">${stock.pcr}</strong></span>
                                            <span class="text-slate-600">•</span>
                                            <span>FII: <strong class="text-emerald-400">${stock.fii_bias}</strong></span>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end space-y-1">
                                        <span class="text-xs font-black px-3 py-1 rounded-lg ${trendColor} border uppercase tracking-wider">BUY SIGNAL</span>
                                        <span class="text-[10px] text-slate-500 font-bold">Composite Score: <strong class="text-emerald-400 font-extrabold">${stock.score}/100</strong></span>
                                    </div>
                                </div>

                                <div class="bg-[#05070e] border border-slate-900 rounded-xl p-3 grid grid-cols-6 gap-1.5 text-center">
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">5M</div>
                                        <div class="text-[9px] py-1 rounded ${parseBadge(stock.tf_5m)} uppercase tracking-tighter">5M</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">15M</div>
                                        <div class="text-[9px] py-1 rounded ${parseBadge(stock.tf_15m)} uppercase tracking-tighter">15M</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">1H</div>
                                        <div class="text-[9px] py-1 rounded ${parseBadge(stock.tf_1h)} uppercase tracking-tighter">1H</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">1D</div>
                                        <div class="text-[9px] py-1 rounded ${parseBadge(stock.tf_1d)} uppercase tracking-tighter">1D</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">1W</div>
                                        <div class="text-[9px] py-1 rounded ${parseBadge(stock.tf_1w)} uppercase tracking-tighter">1W</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">1M</div>
                                        <div class="text-[9px] py-1 rounded ${parseBadge(stock.tf_1m)} uppercase tracking-tighter">1M</div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-4 gap-2 text-center py-2.5 bg-slate-900/40 rounded-xl border border-slate-900 font-mono">
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase">ENTRY</div>
                                        <div class="text-xs font-bold text-slate-300">₹${parseFloat(stock.price_at_signal).toFixed(2)}</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase">LTP</div>
                                        <div class="text-xs font-bold text-cyan-400">₹${parseFloat(stock.ltp).toFixed(2)}</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase">TARGET 1</div>
                                        <div class="text-xs font-bold text-emerald-400">₹${parseFloat(stock.target1).toFixed(2)}</div>
                                    </div>
                                    <div>
                                        <div class="text-[9px] text-slate-500 font-bold uppercase">STOP LOSS</div>
                                        <div class="text-xs font-bold text-rose-400">₹${parseFloat(stock.stop_loss).toFixed(2)}</div>
                                    </div>
                                </div>
                            </div>
                        `;

                        if (stock.signal_type.toUpperCase() === 'BTST') {
                            btstContainer.innerHTML += cardHTML;
                            btst++;
                        } else {
                            intradayContainer.innerHTML += cardHTML;
                            intraday++;
                        }
                    });
                    
                    document.getElementById('btstCount').innerText = `${btst} Stocks`;
                    document.getElementById('intradayCount').innerText = `${intraday} Stocks`;
                }
            } catch (err) {
                console.error("Matrix update engine exception:", err);
            } finally {
                countdownTime = 60;
            }
        }

        setInterval(() => {
            countdownTime--;
            timerBadge.innerHTML = `<i class="fa-solid fa-arrows-rotate animate-spin text-[10px] mr-1.5"></i> Sync: ${countdownTime}s`;
            if (countdownTime <= 0) updateDashboardData();
        }, 1000);

        setInterval(() => {
            document.getElementById('clockData').innerText = new Date().toLocaleTimeString();
        }, 1000);

        window.onload = updateDashboardData;
    </script>
</body>
</html>
